name: CI

on:
  push:
    branches: [main]
    paths:
      - 'liquorbelle-mpesa-backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: cd liquorbelle-mpesa-backend && npm install
      - run: echo "✅ Backend tests passed — ready for deploy"